# Builds a Fabric mod with Gradle and publishes the jar to GitHub Releases.
#   Push / PR to master -> build only
#   Push a tag (v*)     -> build, then create a GitHub Release
#
# gradle/actions v6 uses a proprietary caching component by default.
# For the open-source one, add "cache-provider: basic" under setup-gradle.

name: Build and Release Fabric Mod

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: mod-jars
        path: |
          build/libs/*.jar
          !build/libs/*-dev.jar
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: mod-jars
        path: dist

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        flags=()
        if [[ "$TAG" =~ -(alpha|beta|rc|pre) ]]; then
          flags+=(--prerelease)
        fi

        # If the release already exists (e.g. a re-run), replace its files
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" dist/*.jar --clobber
        else
          gh release create "$TAG" dist/*.jar \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
        fi

  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6
